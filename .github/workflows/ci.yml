# Tests run here, on GitHub's runners. The deploy job runs ONLY when the test job is green AND the event is a
# push to main — a red run never sends anything, and a green PR or feature branch never deploys. What it sends
# is one HMAC-signed request to the box's deploy hook (ops/deploy-hook); the box then checks out that exact
# commit, builds, restarts and health-checks, rolling back if the API does not come up.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Web + engine (typecheck, rules, wire guard, routes, location, gallery)
        run: npm test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Backend (Django, SQLite)
        run: python manage.py test tracker --noinput
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///ci.sqlite3

  deploy:
    name: Deploy to tracker.wyreng.com
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      HOOK: https://tracker.wyreng.com/hooks/deploy
      SHA: ${{ github.sha }}
      REF: ${{ github.ref }}
    steps:
      - name: Ask the box to deploy this commit
        env:
          SECRET: ${{ secrets.DEPLOY_HOOK_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::warning::DEPLOY_HOOK_SECRET is not set on this repository — tests passed, deploy skipped."
            echo "skipped=1" >> "$GITHUB_ENV"; exit 0
          fi
          body=$(printf '{"sha":"%s","ref":"%s"}' "$SHA" "$REF")
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" | sed 's/^.* //')
          for attempt in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/reply -w '%{http_code}' -X POST "$HOOK" \
              -H 'Content-Type: application/json' -H "X-Signature-256: sha256=$sig" --data "$body")
            echo "hook → $code: $(cat /tmp/reply)"
            if [ "$code" = 202 ]; then exit 0; fi
            if [ "$code" = 409 ]; then echo "a deploy is already running — retrying in 60 s"; sleep 60; continue; fi
            echo "::error::deploy hook refused ($code)"; exit 1
          done
          echo "::error::the box stayed busy for five minutes"; exit 1

      - name: Wait for the box to finish and report
        if: env.skipped != '1'
        run: |
          for i in $(seq 1 90); do
            s=$(curl -sS "$HOOK/status" || echo '{}')
            state=$(printf '%s' "$s" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("state",""))' 2>/dev/null || echo "")
            sha=$(printf '%s' "$s" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("sha",""))' 2>/dev/null || echo "")
            note=$(printf '%s' "$s" | python3 -c 'import sys,json; d=json.load(sys.stdin); print(d.get("note",""))' 2>/dev/null || echo "")
            if [ "$sha" = "$SHA" ]; then
              case "$state" in
                ok) echo "deployed $SHA"; exit 0 ;;
                rolled_back) echo "::error::deploy of $SHA failed its health check and was rolled back — $note"; exit 1 ;;
                failed) echo "::error::deploy of $SHA failed — $note"; exit 1 ;;
              esac
            fi
            sleep 10
          done
          echo "::error::no result from the box after 15 minutes"; exit 1
