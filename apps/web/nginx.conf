# Serves the built SPA and proxies the API, so the browser sees a single origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # uploads: visit photos and scanned documents run large, and DATA_UPLOAD_MAX_MEMORY_SIZE is 25 MB
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Vite fingerprints these, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # These three must never be cached, or a browser keeps running last week's app against this week's API.
    location = /index.html { add_header Cache-Control "no-store, must-revalidate"; }
    location = /sw.js      { add_header Cache-Control "no-store, must-revalidate"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-store, must-revalidate"; }

    location /api/   { proxy_pass http://api:8000; include /etc/nginx/conf.d/proxy.inc; }
    location /admin/ { proxy_pass http://api:8000; include /etc/nginx/conf.d/proxy.inc; }
    location /static/ { proxy_pass http://api:8000; include /etc/nginx/conf.d/proxy.inc; }

    # client-side routing: every unknown path is a react-router route, not a 404
    location / { try_files $uri $uri/ /index.html; }
}
