# Wyre Tracker backend — Postgres + Django API.
#   cp .env.docker.example .env.docker   (set POSTGRES_PASSWORD and SECRET_KEY)
#   docker compose up -d --build
# The API is on http://localhost:8000; run the web app with VITE_API_URL=http://localhost:8000/api/v1
name: wyre-tracker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wyre_tracker}
      POSTGRES_USER: ${POSTGRES_USER:-wyre_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wyre_tracker} -d ${POSTGRES_DB:-wyre_tracker}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # loopback only: this is for psql on the machine running the stack, not for the internet.
    # The API reaches it over the compose network and needs no published port at all.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wyre_tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wyre_tracker}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.docker}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:4173}
      SEED_DEMO: ${SEED_DEMO:-0}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_REGION: ${SPACES_REGION:-fra1}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      SPACES_URL_EXPIRY: ${SPACES_URL_EXPIRY:-900}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-mg.wyreng.com}
      MAILGUN_FROM: ${MAILGUN_FROM:-Wyre Tracker <postmaster@mg.wyreng.com>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5174}
    volumes:
      - media:/app/media
    # loopback only: nginx (host or the web container) is what the outside world talks to
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"

  # The schedule lives in the stack, not on somebody's laptop: same image, no cron daemon, restarts with
  # everything else. Reconciling alerts is harmless; the email digest stays off until DIGEST_ENABLED=1.
  scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-wyre_tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-wyre_tracker}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.docker}
      DEBUG: ${DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      SPACES_BUCKET: ${SPACES_BUCKET:-}
      SPACES_REGION: ${SPACES_REGION:-fra1}
      SPACES_ENDPOINT: ${SPACES_ENDPOINT:-}
      SPACES_KEY: ${SPACES_KEY:-}
      SPACES_SECRET: ${SPACES_SECRET:-}
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-mg.wyreng.com}
      MAILGUN_FROM: ${MAILGUN_FROM:-Wyre Tracker <postmaster@mg.wyreng.com>}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5174}
      ALERTS_INTERVAL_MINUTES: ${ALERTS_INTERVAL_MINUTES:-60}
      DIGEST_AT: ${DIGEST_AT:-07:30}
      DIGEST_ENABLED: ${DIGEST_ENABLED:-0}
      DIGEST_TO: ${DIGEST_TO:-}
    volumes:
      - media:/app/media
    # migrations are the api container's job; this one only needs to wait for them
    entrypoint: ["python", "manage.py", "scheduler"]

volumes:
  pgdata:
  media:
